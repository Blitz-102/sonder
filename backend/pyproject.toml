[project]
name = "sonder"
version = "0.1.0"
description = "Local-first music discovery app for guitarists"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.1",
    "librosa>=0.11",
    "scipy>=1.14",
    "rapidfuzz>=3.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
ml = [
    "torch>=2.8",
    "transformers>=5.0",
    "demucs-infer>=4.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sonder"]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu134", extra = "ml" }

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: loads ML models; skipped in CI",
]
